<!DOCTYPE html>
<html>
<head>
  <title>Contact Form</title>
  <style>
    body{
      font-family: Arial;
      max-width:600px;
      margin:auto;
      padding:40px;
    }

    input, textarea{
      width:100%;
      padding:10px;
      margin-bottom:15px;
    }

    button{
      padding:10px 20px;
    }

    #result{
      margin-top:20px;
      color:green;
    }
  </style>
</head>
<body>

<h1>Contact Us</h1>

<form id="contactForm">
  <input type="text" name="name" required>
  <input type="email" name="email" required>
  <textarea name="message"></textarea>

  <button type="submit">
    Send Message
  </button>
</form>

<p id="result"></p>



<script>
const scriptURL =
'https://script.google.com/macros/library/d/1UTUEb4ll-7SrWGfS41qRhp6CIw-Vaqdb_haqk5dKcHSnS6uPcdT7Mo4-/1';

const form =
document.getElementById('contactForm');

form.addEventListener('submit', e => {
  e.preventDefault();

  fetch(scriptURL, {
    method: 'POST',
    body: new FormData(form)
  })
  .then(response => {
    document.getElementById('result').innerHTML =
      'Message sent successfully!';
    form.reset();
  })
  .catch(error => {
    console.error(error);
    document.getElementById('result').innerHTML =
      'Error sending message.';
  });
});
<script>
</body>
</html>
