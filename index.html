<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 12px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    #result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Contact Us</h1>

  <form id="contactForm">
    <input
      type="text"
      name="name"
      placeholder="Your Name"
      required
    >

    <input
      type="email"
      name="email"
      placeholder="Your Email"
      required
    >

    <textarea
      name="message"
      placeholder="Your Message"
      rows="5"
      required
    ></textarea>

    <button type="submit">
      Send Message
    </button>
  </form>

  <p id="result"></p>

  <script>
    const scriptURL =
      'https://script.google.com/macros/s/AKfycbyuILeFo4XWnwpNcpGeeYCkIiANVj2fmBjKg0wM97sNq-Cc3pGHraCzs9wheM4o8uJ74w/exec';

    const form = document.getElementById('contactForm');
    const result = document.getElementById('result');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      result.style.color = 'black';
      result.textContent = 'Sending...';

      fetch(scriptURL, {
        method: 'POST',
        body: new FormData(form),
        mode: 'no-cors'
      })
      .then(() => {
        result.style.color = 'green';
        result.textContent = 'Message sent successfully!';
        form.reset();
      })
      .catch(error => {
        console.error(error);
        result.style.color = 'red';
        result.textContent = 'Error sending message.';
      });
    });
  </script>

</body>
</html>
