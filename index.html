<!DOCTYPE html>
<html>
<head>
  <title>Contact Form</title>
  <style>
    body{
      font-family: Arial;
      max-width:600px;
      margin:auto;
      padding:40px;
    }

    input, textarea{
      width:100%;
      padding:10px;
      margin-bottom:15px;
    }

    button{
      padding:10px 20px;
    }

    #result{
      margin-top:20px;
      color:green;
    }
  </style>
</head>
<body>

<h1>Contact Us</h1>

<form id="contactForm">
  <input type="text" name="name" required>
  <input type="email" name="email" required>
  <textarea name="message"></textarea>

  <button type="submit">
    Send Message
  </button>
</form>

<p id="result"></p>

<script>

const scriptURL =
"https://script.google.com/macros/s/AKfycbwGxUPEGVU2Xc6T7k6Bp_lUM1G1fcRnh82A-VKR0wcMuEGrSsVcDUYBg-qlfseNYbXQTA/exec";

document
.getElementById("contactForm")
.addEventListener("submit", function(e){

  e.preventDefault();

  const data = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    message: document.getElementById("message").value
  };

  fetch(scriptURL,{
    method:"POST",
    body:JSON.stringify(data)
  })
  .then(response => response.json())
  .then(data => {
    document.getElementById("result")
      .innerHTML =
      "Message sent successfully!";

    document.getElementById("contactForm")
      .reset();
  })
  .catch(error => {
    document.getElementById("result")
      .innerHTML =
      "Something went wrong.";
  });

});

</script>

</body>
</html>
