<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Contact Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    button {
      padding: 12px 20px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      color: green;
    }
  </style>
</head>
<body>

  <h1>Contact Us</h1>

  <form id="contactForm">
    <input
      type="text"
      name="name"
      placeholder="Your Name"
      required
    >

    <input
      type="email"
      name="email"
      placeholder="Your Email"
      required
    >

    <textarea
      name="message"
      placeholder="Your Message"
      rows="5"
    ></textarea>

    <button type="submit">
      Send Message
    </button>
  </form>

  <p id="result"></p>

  <script>
    const form = document.getElementById('contactForm');
    const result = document.getElementById('result');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      result.innerHTML = 'Sending...';

      fetch(window.location.href, {
        method: 'POST',
        body: new FormData(form)
      })
      .then(() => {
        result.innerHTML =
          'Message sent successfully!';
        form.reset();
      })
      .catch(err => {
        result.innerHTML =
          'Error sending message.';
        console.error(err);
      });
    });
  </script>

</body>
</html>
